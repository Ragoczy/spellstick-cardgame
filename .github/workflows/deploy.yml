name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the game server's tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spellstick
          POSTGRES_PASSWORD: spellstick
          POSTGRES_DB: spellstick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spellstick"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://spellstick:spellstick@localhost:5432/spellstick
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Headless sim (smoke)
        run: npm run sim -- --games 50 --seed 1 --out ${{ runner.temp }}/sim-smoke.md
      - run: npm run build
      # GitHub Pages no longer hosts the game. It serves only a "this has moved" page, as both
      # index.html and 404.html, so every old link is sent on to the Azure address.
      - name: Prepare the moved page for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp pages-redirect/index.html "$RUNNER_TEMP/pages/index.html"
          cp pages-redirect/index.html "$RUNNER_TEMP/pages/404.html"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-and-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The online game on Azure (see infra/README.md). Signs in as id-spellstick-deploy, which
  # trusts this repo's main branch, so no Azure password is stored in GitHub.
  deploy-azure:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-and-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: acrha7siia4h4zia.azurecr.io/spellstick:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          az acr login -n acrha7siia4h4zia
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Switch the app to the new image
        run: |
          rev=$(az containerapp update -g rg-spellstick -n ca-spellstick --image "$IMAGE" --query properties.latestRevisionName -o tsv)
          echo "New revision: $rev"
          echo "REVISION=$rev" >> "$GITHUB_ENV"
      - name: Check the new version is healthy
        run: |
          url=https://ca-spellstick.proudbush-0a90b692.eastus2.azurecontainerapps.io
          for i in $(seq 1 30); do
            # A request wakes the app if it has stopped for being idle.
            curl -s -o /dev/null --max-time 20 "$url/healthz" || true
            state=$(az containerapp revision show -g rg-spellstick -n ca-spellstick --revision "$REVISION" --query properties.healthState -o tsv)
            if [ "$state" = "Healthy" ]; then echo "Live at $url ($REVISION)"; exit 0; fi
            echo "Waiting ($state)..."
            sleep 10
          done
          echo "The new version didn't become healthy. Logs: az containerapp logs show -g rg-spellstick -n ca-spellstick" >&2
          exit 1
